# Install in /etc/nginx/sites-available/ and enable from sites-enabled/.
# The existing certbot DNS-01 certificate covers *.katstack.dev.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bdo-api.katstack.dev;

    ssl_certificate /etc/letsencrypt/live/katstack.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/katstack.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BDO_API_TLS:1m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 10s;
    send_timeout 15s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;

    # Do not log OAuth codes or tokens in query strings.
    access_log off;
    error_log /var/log/nginx/bdo-api-error.log warn;

    # Infrastructure health only, not an OAuth readiness endpoint.
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"proxy_ready","oauth":"not_configured"}';
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_intercept_errors on;
        error_page 502 504 = @backend_unavailable;
    }

    location @backend_unavailable {
        default_type application/json;
        return 503 '{"error":"backend_not_ready"}';
    }
}
